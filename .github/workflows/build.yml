name: Build V20 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio rsync kmod device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python-is-python3
          echo "--- versions ---"
          make --version | head -1
          gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download Huawei GPL kernel source
        run: |
          mkdir -p src && cd src
          URL='https://download-c1.huawei.com/download/downloadCenter?downloadId=1D5E58A281FBDBBE7A520B08B8C9A784&version=36E53E6A525178CF28BDC47B6FBF3CAA&siteCode=worldwide'
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== attempt $i ==="
            curl -L -C - --retry 5 --retry-delay 5 --retry-all-errors \
              -H 'User-Agent: Mozilla/5.0' \
              -o pct.tar.gz "$URL" || true
            SZ=$(stat -c%s pct.tar.gz 2>/dev/null || echo 0)
            echo "size=$SZ / 592412856"
            if [ "$SZ" -ge 592412856 ]; then echo 'download complete'; break; fi
            sleep 5
          done
          ls -lh pct.tar.gz
          tar -xzf pct.tar.gz
          echo "--- top level ---"
          ls -la
          echo "--- kernel Makefile ---"
          head -14 Code_Opensource/kernel/Makefile

      - name: Download clang 9.0.3 (r353983c)
        run: |
          mkdir -p $HOME/toolchain && cd $HOME/toolchain
          BASE='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android10-release/clang-r353983c.tar.gz'
          curl -L --retry 5 --retry-delay 5 -o clang.tar.gz "$BASE"
          ls -lh clang.tar.gz
          mkdir -p clang-r353983c && tar -xzf clang.tar.gz -C clang-r353983c
          $HOME/toolchain/clang-r353983c/bin/clang --version | head -3

      - name: Prepare kernel config
        run: |
          cd src/Code_Opensource/kernel
          if [ -s "$GITHUB_WORKSPACE/configs/v20_defconfig.txt" ] && \
             [ $(wc -l < "$GITHUB_WORKSPACE/configs/v20_defconfig.txt") -gt 100 ]; then
            echo 'using device defconfig from repo'
            cp "$GITHUB_WORKSPACE/configs/v20_defconfig.txt" .config
          else
            echo 'fallback: huawei kirin980 defconfig'
            cp arch/arm64/configs/merge_kirin980_defconfig .config
          fi
          echo "--- config lines: $(wc -l < .config) ---"
          grep -E '^CONFIG_(FUTEX_PI|HW_FUTEX_PI|RT_MUTEXES|CFI_CLANG|LTO_CLANG|ARM64_PAN|SECURITY_SELINUX_DEVELOP|STATIC_USERMODEHELPER)=' .config || true

      - name: Build kernel
        run: |
          cd src/Code_Opensource/kernel
          export PATH=$HOME/toolchain/clang-r353983c/bin:$PATH
          set +e
          make ARCH=arm64 O=../../out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            HOSTCC=gcc HOSTCXX=g++ \
            -j$(nproc) 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "=== build exit code: $RC ==="
          tail -60 /tmp/build.log
          if [ ! -f ../../out/vmlinux ]; then
            echo '=== vmlinux NOT produced ==='
            ls -la ../../out/ 2>/dev/null | head -30
            echo '=== errors ==='
            grep -iE 'error:|Error [0-9]|fatal error' /tmp/build.log | head -40 || true
            exit 1
          fi
          ls -lh ../../out/vmlinux

      - name: Extract symbols
        if: success()
        run: |
          mkdir -p artifacts
          VMLINUX=$(find "$GITHUB_WORKSPACE" -name vmlinux -type f | head -1)
          echo "vmlinux=$VMLINUX"
          aarch64-linux-gnu-nm -n "$VMLINUX" > artifacts/System.map 2>/dev/null || \
            nm -n "$VMLINUX" > artifacts/System.map || true
          wc -l artifacts/System.map
          echo '=== key symbols ==='
          grep -E ' (init_task|init_cred|commit_creds|prepare_kernel_cred|selinux_enforcing|ashmem_misc|sysctl_perf_event_paranoid)$' \
            artifacts/System.map || true
          echo '=== kernel banner ==='
          strings "$VMLINUX" | grep -m3 'Linux version 4\.14' || true
          cp "$VMLINUX" artifacts/vmlinux
          cp src/Code_Opensource/kernel/.config artifacts/kernel.config 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-kernel-artifacts
          path: |
            artifacts/
            /tmp/build.log
          retention-days: 30
